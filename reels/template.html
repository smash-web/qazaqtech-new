<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0B1B3A; }
  body { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; color: #fff; }
  .layer { position: absolute; inset: 0; }
  /* Студия: картинка 941×1672 (файл вдвое крупнее), камера — transform */
  #studio { overflow: hidden; background: #0B1B3A; }
  .hostbox { position: absolute; left: 0; top: 0; width: 941px; height: 1672px; transform-origin: 0 0; }
  .hostbox img { position: absolute; left: 0; top: 0; width: 941px; height: 1672px; }
  #sweep { position: absolute; top: -200px; bottom: -200px; width: 260px; left: -400px; transform: skewX(-18deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(160,220,255,.16), rgba(255,255,255,0)); mix-blend-mode: screen; }
  .vign { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(5,12,30,.55) 100%); }
  .bshade { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(rgba(5,12,30,0), rgba(5,12,30,.75)); }
  .tshade { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: linear-gradient(rgba(5,12,30,.6), rgba(5,12,30,0)); }
  /* Кадры новости: фото и видео на весь экран */
  #media { overflow: hidden; background: #000; }
  #photo, #clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 45%; }
  #photo { background-size: cover; background-position: center; }
  #clip { object-fit: cover; }
  #credit { position: absolute; right: 40px; top: 270px; max-width: 620px; text-align: right; font-size: 20px; font-weight: 600;
    color: rgba(255,255,255,.8); text-shadow: 0 1px 6px rgba(0,0,0,.8); line-height: 1.3; }
  #credit b { display: inline-block; font-weight: 800; letter-spacing: 1.2px; color: #fff; background: rgba(0,175,202,.9); padding: 3px 8px; border-radius: 5px; margin-bottom: 4px; }
  /* Диктор в круге */
  #pip { position: absolute; left: 48px; top: 1250px; width: 330px; height: 330px; border-radius: 50%; overflow: hidden;
    background: #0B1B3A; border: 8px solid #1881FF; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  #pip .hostbox { transform: translate(-215px, -390px) scale(.84); }
  /* Шапка */
  #top { position: absolute; left: 56px; right: 56px; top: 190px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 38px; font-weight: 800; letter-spacing: -.5px; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .logo img { height: 60px; width: auto; display: block; filter: drop-shadow(0 2px 10px rgba(0,0,0,.5)); }
  #outro .mark img { height: 120px; width: auto; display: block; }
  .live { display: flex; align-items: center; gap: 10px; background: rgba(5,12,30,.55); padding: 9px 18px; border-radius: 999px; font-size: 24px; font-weight: 800; letter-spacing: 1.5px; }
  .live i { width: 12px; height: 12px; border-radius: 50%; background: #FF3B3B; display: block; box-shadow: 0 0 12px #FF3B3B; }
  /* Субтитры как в рилсах: 2–3 слова, слово «выпрыгивает», текущее — жёлтым */
  #caps { position: absolute; left: 70px; right: 70px; top: 1420px; display: flex; justify-content: center; text-align: center; }
  #caps p { margin: 0; max-width: 900px; font-size: 44px; line-height: 1.28; font-weight: 600; color: #fff;
    background: rgba(5,12,30,.68); padding: 14px 24px; border-radius: 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  /* Хук в начале: тема новости */
  #hook { position: absolute; left: 56px; right: 56px; top: 1250px; }
  #hook.over { top: 880px; }
  #hook.top { top: 380px; }
  #hook .tag { display: inline-block; background: #1881FF; color: #fff; font-weight: 900; font-size: 30px; letter-spacing: 2px; padding: 10px 18px; border-radius: 10px; transform: rotate(-2deg); }
  #hook .t { margin-top: 18px; font-size: 56px; font-weight: 900; line-height: 1.05; letter-spacing: -1.2px; text-transform: uppercase;
    -webkit-text-stroke: 10px #0B1B3A; paint-order: stroke fill; }
  /* Бегущая строка */
  #ticker { position: absolute; left: 0; right: 0; top: 1640px; height: 70px; display: flex; background: rgba(5,12,30,.92); overflow: hidden; }
  #ticker .lbl { flex: 0 0 auto; background: #1881FF; color: #0B1B3A; font-weight: 900; font-size: 26px; letter-spacing: 2px; padding: 0 20px; display: flex; align-items: center; z-index: 1; }
  #ticker .run { position: relative; flex: 1; overflow: hidden; }
  #ticker .run div { position: absolute; top: 0; height: 70px; display: flex; align-items: center; white-space: nowrap; font-size: 28px; font-weight: 600; color: #DCE7F5; }
  #ticker .run b { color: #1881FF; margin: 0 20px; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #wipe { position: absolute; top: 0; bottom: 0; width: 1400px; left: -3000px; background: #1881FF; transform: skewX(-12deg); }
  #wipe::after { content: ''; position: absolute; top: 0; bottom: 0; right: -90px; width: 90px; background: #1881FF; }
  #outro { display: flex; align-items: center; justify-content: center; background: rgba(5,12,30,.72); backdrop-filter: blur(14px); }
  #outro .cta { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #outro .mark { display: flex; align-items: center; gap: 18px; font-size: 76px; font-weight: 800; letter-spacing: -1px; }
  #outro .mark b { color: #1881FF; }
  #outro .site { background: #1881FF; color: #fff; font-size: 64px; font-weight: 900; padding: 14px 30px; border-radius: 18px; transform: rotate(-2deg); }
  #outro .follow { font-size: 40px; font-weight: 800; text-shadow: 0 3px 12px rgba(0,0,0,.6); }
</style>
</head>
<body>
  <div id="media" class="layer"><div id="photo"></div><img id="clip" alt=""><div class="vign"></div><div class="tshade"></div><div class="bshade"></div><div id="credit"></div></div>
  <div id="studio" class="layer"><div class="hostbox" id="hostMain"></div><div id="sweep"></div><div class="vign"></div><div class="tshade"></div><div class="bshade"></div></div>
  <div id="pip"><div class="hostbox" id="hostPip"></div></div>
  <div id="top">
    <div class="logo"><img id="logoTop" alt="TechTalQ"></div>
    <div class="live"><i id="dot"></i><span id="dateLabel"></span></div>
  </div>
  <div id="hook"><span class="tag" id="cat"></span><div class="t" id="teaser"></div></div>
  <div id="caps"><p id="capText"></p></div>
  <div id="ticker"><span class="lbl">ЖАҢАЛЫҚТАР</span><div class="run"><div id="tickText"></div></div></div>
  <div id="outro" class="layer"><div class="cta"><div class="mark"><img id="logoOutro" alt="TechTalQ"></div><span class="site">techtalq.kz</span><span class="follow">Жазылыңыз — @techtalq.kz</span></div></div>
  <div id="flash"></div>
  <div id="wipe"></div>
<script>
/* Данные ролика подставляет render.py: window.REEL = {...} */
const R = window.REEL;
const $ = (id) => document.getElementById(id);
$('logoTop').src = R.logoImage; $('logoOutro').src = R.logoImage;
$('hostMain').innerHTML = `<img src="${R.hostImage}">` + R.hostSvg;
$('hostPip').innerHTML = `<img src="${R.hostImage}">` + R.hostSvg.replace(/id="/g, 'id="p-').replace(/url\(#/g, 'url(#p-');
$('photo').style.backgroundImage = `url(${R.photo})`;
$('cat').textContent = R.category;
$('dateLabel').textContent = R.dateLabel;
$('teaser').textContent = R.teaser;
$('tickText').innerHTML = (R.ticker && R.ticker.length ? R.ticker : [R.title]).map((x) => `<b>●</b>${x}`).join('') + '<b>●</b>';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const MOUTHS = ['closed', 'small', 'mid', 'wide', 'o', 'smile'];
function setMouth(prefix, m) { for (const k of MOUTHS) { const el = document.getElementById(prefix + 'm-' + k); if (el) el.style.display = k === m ? 'inline' : 'none'; } }
function mouthAt(t) { for (const v of R.visemes) { if (t >= v[0] && t < v[1]) return v[2]; } return null; }
function blinkAt(t) { for (const b of R.blinks) { if (t >= b && t < b + 0.12) return true; } return false; }
const CAMS = {
  wide:   { zoom: 1.00, fx: 470, fy: 836, px: 540, py: 960 },
  wide2:  { zoom: 1.12, fx: 470, fy: 800, px: 540, py: 930 },
  medium: { zoom: 1.55, fx: 472, fy: 760, px: 540, py: 860 },
  medium2:{ zoom: 1.70, fx: 472, fy: 745, px: 540, py: 840 },
  close:  { zoom: 2.30, fx: 473, fy: 670, px: 540, py: 760 },
  close2: { zoom: 2.55, fx: 473, fy: 665, px: 540, py: 740 },
};
function camTransform(c, t) {
  const sc = 1080 / 941 * c.zoom, sway = Math.sin(t * .7) * 3, bob = Math.sin(t * 1.1) * 2.5;
  let ox = c.px - c.fx * sc + sway, oy = c.py - c.fy * sc + bob;
  ox = Math.min(0, Math.max(1080 - 941 * sc, ox)); oy = Math.min(0, Math.max(1920 - 1672 * sc, oy));
  return `translate(${ox}px, ${oy}px) scale(${sc})`;
}
function mixCam(a, b, x) { const o = {}; for (const k in a) o[k] = lerp(a[k], b[k], x); return o; }

function render(t) {
  const shot = R.shots.find((s) => t >= s.start && t < s.end) || R.shots[R.shots.length - 1];
  const si = R.shots.indexOf(shot), local = (t - shot.start) / Math.max(.01, shot.end - shot.start);
  const studio = shot.type === 'studio';
  const T = R.timeline, inIntro = t < T.introEnd, inOutro = t >= T.outroStart;
  $('studio').style.display = studio ? 'block' : 'none';
  $('media').style.display = studio ? 'none' : 'block';
  const endCard = t >= T.end - 2.6;
  $('pip').style.display = 'none';
  $('hook').style.display = t < T.introEnd + 3.6 ? 'block' : 'none';
  $('outro').style.display = endCard ? 'flex' : 'none';
  $('top').style.opacity = endCard ? 0 : 1;
  $('ticker').style.display = studio ? 'flex' : 'none';

  if (studio) {
    const c = mixCam(CAMS[shot.cam0], CAMS[shot.cam1], ease(local));
    $('hostMain').style.transform = camTransform(c, t);
    $('studio').style.opacity = si === 0 ? ease(t / .4) : 1;
    const sw = (t % 6.5) / 1.6; $('sweep').style.left = (sw < 1 ? -400 + sw * 1900 : -600) + 'px';
  } else {
    // склейки внутри новости: фото и видео сменяют друг друга, на каждой — «толчок» зума
    const cut = R.cuts.find((c) => t >= c.start && t < c.end) || R.cuts[R.cuts.length - 1];
    const k = (t - cut.start) / Math.max(.01, cut.end - cut.start), punch = 1 + .1 * (1 - ease((t - cut.start) / .3));
    const z = punch * (1.02 + k * .08), dx = (cut.dir || 1) * k * 30;
    if (cut.kind === 'clip') {
      const clip = R.broll[cut.clip] || R.broll[0];
      const i = Math.floor((t - cut.start + (cut.from || 0)) * 30) % clip.count;
      const src = `${clip.dir}/${String(i + 1).padStart(5, '0')}.jpg`;
      if ($('clip').getAttribute('src') !== src) $('clip').setAttribute('src', src);
      $('clip').style.display = 'block'; $('photo').style.display = 'none';
      $('clip').style.transform = `scale(${1 + .015 * k})`;  // видео не увеличиваем — сюжет должен быть виден
      $('credit').innerHTML = `<b>${clip.own ? 'ДЕРЕККӨЗ БЕЙНЕСІ' : 'ИЛЛЮСТРАЦИЯЛЫҚ КАДРЛАР'}</b><br>Видео: ${clip.credit || ''}`;
    } else {
      $('clip').style.display = 'none'; $('photo').style.display = 'block';
      $('photo').style.transform = `scale(${z}) translateX(${dx}px)`;
      $('credit').innerHTML = R.photoCredit ? `Фото: ${R.photoCredit}` : '';
    }
  }
  for (const pre of ['', 'p-']) {
    const g = document.getElementById(pre + 'glow'); if (g) g.style.opacity = (.25 + .25 * (0.5 + 0.5 * Math.sin(t * 2.4))).toFixed(3);
    const lids = document.getElementById(pre + 'lids'); if (lids) lids.style.display = blinkAt(t) ? 'inline' : 'none';
  }
  $('dot').style.opacity = (Math.floor(t * 1.6) % 2) ? .35 : 1;
  const m = mouthAt(t) || (t < .4 || t > T.end - .5 ? 'smile' : 'closed');
  setMouth('', m); setMouth('p-', m);
  let wipe = -1, flash = 0;
  for (let i = 1; i < R.shots.length; i++) {
    const a = R.shots[i - 1].type, b2 = R.shots[i].type, d = t - R.shots[i].start;
    if ((a === 'studio') !== (b2 === 'studio')) { if (d > -.4 && d < .4) wipe = (d + .4) / .8; }
    else if (d >= 0 && d < .1) flash = .35 * (1 - d / .1);
  }
  for (const c of R.cuts) { const d = t - c.start; if (d >= 0 && d < .08 && !c.first) flash = Math.max(flash, .18 * (1 - d / .08)); }
  $('wipe').style.left = wipe < 0 ? '-3000px' : (-1700 + wipe * 3400) + 'px';
  $('flash').style.opacity = flash;
  const hin = R.noHost ? ease(t / .15) : ease((t - .5) / .5);
  const hk = hin * (1 - ease((t - T.introEnd - 3.1) / .5));
  $('hook').className = studio ? '' : (R.noHost ? 'top' : 'over');
  $('hook').style.opacity = hk; $('hook').style.transform = `translateY(${(1 - hin) * 60}px)`;
  const o = ease((t - T.end + 2.6) / .4); $('outro').style.opacity = o; $('outro').querySelector('.cta').style.transform = `scale(${.85 + .15 * back((t - T.end + 2.6) / .5)})`;
  const tw = Math.max(1, $('tickText').scrollWidth), run = 1000 - (t * 150) % (tw + 1000);
  $('tickText').style.left = run + 'px';
  const ph = R.phrases.find((x) => t >= x.start && t < x.end);
  if (ph && !inIntro && !endCard) {
    $('capText').textContent = ph.words.map((wd) => wd.text).join(' ');
    $('caps').style.display = 'flex';
  } else $('caps').style.display = 'none';
}
window.render = render;
window.ready = () => new Promise((res) => { const im = $('clip');
  if ($('media').style.display === 'none' || im.style.display === 'none' || !im.getAttribute('src') || im.complete) return res();
  im.onload = im.onerror = () => res(); });
render(0);
</script>
</body>
</html>
